    <!-- Structured Data (JSON-LD) for SoftwareApplication, FAQPage & HowTo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "VistaroAI",
            "url": "https://www.vistaroai.online",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "All modern browsers (Chrome, Edge, Firefox, Safari)",
            "description": "High-resolution in-browser image splitting, Instagram carousel maker, storyboard slicing, and hardware-accelerated motion video generation application.",

              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },

              "Seamless Instagram Carousel splitting (4:5, 1:1, custom)",
              "Webtoon & Manga vertical panel slicing with automated gutter detection",
              "Hardware WebCodecs 4K MP4 motion video rendering with Ken Burns transitions",

            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does my image or video ever get uploaded to a cloud server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No, never. All image ingestion, border detection, grid slicing, and MP4 video encoding occur 100% in-browser on your local machine using HTML5 Canvas and WebCodecs APIs. Your creative files never touch a remote server."

              },

                "@type": "Question",
                "name": "How do I create a seamless Instagram carousel swipe post?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Drop your wide panoramic image into Vistaro, choose the Instagram Carousel preset (e.g. 3 panels at 4:5 aspect ratio), and download the ZIP. Upload the numbered panels in order to Instagram for a seamless, continuous panoramic swipe."
                }
              },
              {
                "@type": "Question",
                "name": "Can I convert comic strips and storyboards into motion videos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The Motion Video Studio allows you to apply cinematic Ken Burns pan-and-zoom camera movements, add music, and export crisp 60 FPS 4K MP4 videos directly in your browser."
                }
              }
            ]
          }
        ]
      }
